{% extends "base.html" %}
{% block title %}Register — Online Exam System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <h2>📋 Register</h2>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="apna pura naam enter karein" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="apna email enter karein" required>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="text-muted">(kam se kam 6 characters)</span></label>
                <input type="password" id="password" name="password"
                       placeholder="strong password banaein" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Register ✅
            </button>
        </form>

        <div class="auth-footer">
            Already account hai?
            <a href="{{ url_for('home') }}">Login karein</a>
        </div>
    </div>
</div>
{% endblock %}
